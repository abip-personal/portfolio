# Cloudflare Worker config — assets-only, no code.
#
# The site is 100% static (Astro `output: 'static'`), so this Worker has no
# script entrypoint (`main`), no bindings and no compatibility flags: the
# `[assets]` block is the whole deployment, and Cloudflare serves `dist/`
# straight from the edge without ever booting a Worker isolate. That is also
# why there is no `_routes.json` — that file is Pages-only, and on Workers the
# "never invoke a Function" behaviour it asked for is simply the default when
# no entrypoint exists.
#
# Security and cache headers live in `public/_headers`, which Astro copies to
# `dist/_headers` at build time; Workers Static Assets honours that file.
name = "portfolio"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
# `404-page` — not `single-page-application`. This is a multi-page static build
# with real URLs per route, and Astro emits `dist/404.html`; SPA handling would
# rewrite every miss to `index.html` with a 200 and hide genuine 404s from
# crawlers and from the link checker.
not_found_handling = "404-page"
